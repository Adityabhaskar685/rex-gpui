[package]
name = "rex-gpui"
version = "0.1.0"
edition = "2024"
description = "A community Linux desktop client for the Rex terminal multiplexer, built on GPUI and libghostty-vt"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.23.1"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11.11"
futures-util = "0.3.34"
gpui = "0.2.2"
log = "0.4.34"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "process"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["client", "staging"] }

# GPUI and the terminal parser are slow unoptimized; optimize dependencies even in debug
# builds so `cargo run` stays usable. Release builds are still faster.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"

[build-dependencies]
bindgen = { version = "0.73", default-features = false, features = ["runtime"] }
pkg-config = "0.3.34"
